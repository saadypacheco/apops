# Supabase local config — APOPS Siempre
# Generated for local development. Sobreescribir secretos con .env.local.

project_id = "apops-siempre"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
# Deshabilitado el 2026-05-01 (Phase 2 de feature 001-afiliado-auth).
# Motivo: container supabase_storage falla healthcheck en Windows local
# (ver docs/bitacora-sdd.md Paso 16). La feature de auth no usa storage.
# Reactivar cuando ingrese la feature de credencial digital con QR
# o cualquier otra que requiera subir archivos.
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# Signup habilitado a nivel auth.users porque la Edge Function
# solicitar-magic-link necesita poder crear users vía signInWithOtp después
# de validar contra padrón. La protección real (un user solo se crea si pasa
# por la Edge Function que valida padrón APOPS) vive en el flujo de la app,
# no en este flag. Si en el futuro queremos cerrar /auth/v1/otp al cliente,
# podemos cambiar la estrategia a admin.generateLink + email custom.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
# Permitimos magic-link login porque la Edge Function solicitar-magic-link
# pre-valida contra padrón APOPS antes de generar el link. El email
# transaccional NO lo manda gotrue (su template default genera URL rota en
# local — bug del CLI v2.98 con el path /email/ del template server).
# En su lugar, la Edge Function genera el hashed_token con admin.generateLink
# y manda el email custom via SMTP a Mailpit.
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

# Cumplimiento constitución V (privacidad por diseño Ley 25.326):
# - signup deshabilitado: usuarios solo se crean vía Edge Function tras validar contra padrón
# - anon sign-ins deshabilitados: no permitimos sesiones anónimas
# - analytics deshabilitado: no enviamos datos a Supabase telemetry
